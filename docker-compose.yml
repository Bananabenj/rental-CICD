services:
  car-rental-service:
    build:
      context: ./apps/car-rental-service
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: car-rental-service
    networks:
      - rental-network

  pricing-service:
    build:
      context: ./apps/pricing-service
    ports:
      - "8000:8000"
    networks:
      - rental-network

networks:
  rental-network:
    driver: bridge
